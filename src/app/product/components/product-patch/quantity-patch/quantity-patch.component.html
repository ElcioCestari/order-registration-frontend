<form #productForm="ngForm" (ngSubmit)="update()">
  <div class="container">
    <div class="input-fields">
      <mat-form-field>
        <mat-label>Quantidade</mat-label>
        <input
          matInput
          [(ngModel)]="product.stock.quantity"
          name="quantity"
          type="number"
          min="0"
          placeholder="1"
          required
          #quantity="ngModel"
        />
        <mat-error *ngIf="quantity.invalid">valor inválido</mat-error>
      </mat-form-field>
    </div>
    <div class="actions">
      <button type="button" mat-raised-button (click)="cancel()">cancelar</button>
      <button
        type="submit"
        mat-raised-button
        [disabled]="productForm.invalid"
        color="primary"
      >
        salvar
      </button>
    </div>
  </div>
</form>
