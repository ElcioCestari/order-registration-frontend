server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths (e.g. a refresh on /products/list) are routed by Angular
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Missing static files (paths with an extension) are real 404s, not the app shell
  location ~* \.[a-z0-9]+$ {
    try_files $uri =404;
  }

  # Never cache the entry point or the runtime config, so new deploys/settings are picked up
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /assets/config.json {
    add_header Cache-Control "no-store";
  }
}
